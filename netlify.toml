# Configuración de Netlify para Rotisería La Plaza
#
# Con este archivo en la raíz, Netlify no pregunta nada: al conectar el repo
# ya sabe cómo compilar y qué publicar.
#
# El dominio NO se escribe acá. Netlify inyecta la variable `URL` en cada build
# y astro.config.mjs la usa: cuando conectes el dominio propio desde el panel,
# el canonical, el Open Graph, el sitemap y el robots.txt se actualizan solos.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Fijado para que el build en Netlify use la misma versión con la que se
  # desarrolló. Si no se fija, Netlify puede cambiarla sin aviso.
  NODE_VERSION = "22"

# Los deploys de preview (pull requests) no tienen que indexarse:
# son copias del sitio en un subdominio de Netlify y compiten con el real.
[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# ---------------------------------------------------------------------------
# Cabeceras
# ---------------------------------------------------------------------------

# Todo lo que Astro compila lleva un hash en el nombre: si el contenido cambia,
# cambia el nombre. Por eso se puede cachear para siempre sin miedo.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El HTML sí tiene que revalidarse: es donde cambia el menú del día.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cabeceras de seguridad. El sitio no tiene backend ni formularios propios,
# así que alcanza con lo básico.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# ---------------------------------------------------------------------------
# Preview de pull requests: que no lo indexe Google
# ---------------------------------------------------------------------------
[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex"
